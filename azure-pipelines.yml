trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'samplepythonapp'

jobs:
- deployment: DeployToNonProd
  displayName: 'Deploy to non-prod environment'
  environment: 'non-prod'
  pool:
    vmImage: 'ubuntu-latest'
  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self

        - script: |
            echo "Building Docker image $(imageName):$(Build.BuildId)"
            docker build -t $(imageName):$(Build.BuildId) .
          displayName: 'Build Docker image'

        - script: |
            echo "Running container from image"
            docker run -d --name $(imageName)-run $(imageName):$(Build.BuildId)
            sleep 5
            docker ps --filter "name=$(imageName)-run"
          displayName: 'Run Docker container'

        - script: |
            echo "Health-checking container"
            HOST=localhost
            PORTS="80 5000 8000 8080"
            SUCCESS=0
            for p in $PORTS; do
              echo "Checking port $p"
              for i in {1..12}; do
                if curl -sSf "http://$HOST:$p/" >/dev/null 2>&1; then
                  echo "Healthy on port $p"
                  SUCCESS=1
                  break 2
                fi
                sleep 5
              done
            done
            if [ "$SUCCESS" -ne 1 ]; then
              echo "Health check failed for ports: $PORTS"
              docker logs $(imageName)-run || true
              exit 1
            fi
          displayName: 'HTTP health-check'

        - script: |
            echo "Stopping and removing container"
            docker stop $(imageName)-run || true
            docker rm $(imageName)-run || true
            echo "Removing image"
            docker rmi $(imageName):$(Build.BuildId) || true
          displayName: 'Cleanup Docker artifacts'
