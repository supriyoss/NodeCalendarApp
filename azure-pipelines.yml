trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'dockernodeapp'

jobs:
- deployment: DeployToNonProd
  displayName: 'Deploy to non-prod environment'
  environment: 'non-prod'
  pool:
    vmImage: 'ubuntu-latest'
  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self

        - script: |
            echo "Building Docker image $(imageName):$(Build.BuildId)"
            docker build -t $(imageName):$(Build.BuildId) .
          displayName: 'Build Docker image'

        - script: |
            echo "Running container from image"
            # Map host port 5173 (Vite/dev) to container; adjust if your app uses a different port
            docker run -d --name $(imageName)-run -p 5173:5173 $(imageName):$(Build.BuildId)
              sleep 5
              docker ps --filter "name=$(imageName)-run"
          displayName: 'Run Docker container'

        

        - script: |
            echo "Stopping and removing container"
            docker stop $(imageName)-run || true
            docker rm $(imageName)-run || true
            echo "Removing image"
            docker rmi $(imageName):$(Build.BuildId) || true
          displayName: 'Cleanup Docker artifacts'
